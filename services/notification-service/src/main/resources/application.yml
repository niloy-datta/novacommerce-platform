spring:
  application:
    name: notification-service
  datasource:
    url: ${NOTIFICATION_DB_URL:jdbc:postgresql://localhost:5432/novacommerce_notification}
    username: ${NOTIFICATION_DB_USERNAME:novacommerce}
    password: ${NOTIFICATION_DB_PASSWORD:novacommerce}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true

server:
  port: ${SERVER_PORT:8086}

management:
  endpoints:
    web:
      exposure:
        include: health,info

notification:
  auth:
    issuer: ${NOTIFICATION_AUTH_ISSUER:novacommerce-auth}
    audience: ${NOTIFICATION_AUTH_AUDIENCE:novacommerce-api}
    jwks-uri: ${NOTIFICATION_AUTH_JWKS_URI:http://localhost:8081/api/v1/auth/jwks}
  allowed-origins: ${NOTIFICATION_ALLOWED_ORIGINS:http://localhost:3000}
