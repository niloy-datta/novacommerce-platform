spring:
  application:
    name: inventory-service
  datasource:
    url: ${INVENTORY_DB_URL:jdbc:postgresql://localhost:5432/novacommerce_inventory}
    username: ${INVENTORY_DB_USERNAME:novacommerce}
    password: ${INVENTORY_DB_PASSWORD:novacommerce}
    hikari:
      connection-init-sql: SET lock_timeout = '5s'
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
server:
  port: ${SERVER_PORT:8083}
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
inventory:
  auth:
    issuer: ${INVENTORY_AUTH_ISSUER:novacommerce-auth}
    audience: ${INVENTORY_AUTH_AUDIENCE:novacommerce-api}
    jwks-uri: ${INVENTORY_AUTH_JWKS_URI:http://localhost:8081/api/v1/auth/jwks}
  allowed-origins: ${INVENTORY_ALLOWED_ORIGINS:http://localhost:3000}
  reservation-ttl: ${INVENTORY_RESERVATION_TTL:PT15M}
  expiration-scan-interval: ${INVENTORY_EXPIRATION_SCAN_INTERVAL:PT30S}
  expiration-batch-size: ${INVENTORY_EXPIRATION_BATCH_SIZE:100}
