spring:
  application:
    name: payment-service
  datasource:
    url: ${PAYMENT_DB_URL:jdbc:postgresql://localhost:5432/novacommerce_payment}
    username: ${PAYMENT_DB_USERNAME:novacommerce}
    password: ${PAYMENT_DB_PASSWORD:novacommerce}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true

server:
  port: ${SERVER_PORT:8085}

management:
  endpoints:
    web:
      exposure:
        include: health,info

payment:
  auth:
    issuer: ${PAYMENT_AUTH_ISSUER:novacommerce-auth}
    audience: ${PAYMENT_AUTH_AUDIENCE:novacommerce-api}
    jwks-uri: ${PAYMENT_AUTH_JWKS_URI:http://localhost:8081/api/v1/auth/jwks}
  allowed-origins: ${PAYMENT_ALLOWED_ORIGINS:http://localhost:3000}
  provider: ${PAYMENT_PROVIDER:MOCK}
  stripe:
    secret-key: ${STRIPE_SECRET_KEY:sk_test_mock}
    webhook-secret: ${STRIPE_WEBHOOK_SECRET:whsec_mock}
