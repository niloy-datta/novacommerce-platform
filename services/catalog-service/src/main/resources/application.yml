spring:
  application:
    name: catalog-service
  datasource:
    url: ${CATALOG_DB_URL:jdbc:postgresql://localhost:5432/novacommerce_catalog}
    username: ${CATALOG_DB_USERNAME:novacommerce}
    password: ${CATALOG_DB_PASSWORD:novacommerce}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
  data:
    redis:
      host: ${CATALOG_REDIS_HOST:${REDIS_HOST:localhost}}
      port: ${CATALOG_REDIS_PORT:${REDIS_PORT:6379}}
      repositories:
        enabled: false
server:
  port: ${SERVER_PORT:8082}
management:
  health:
    redis:
      enabled: false
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
catalog:
  auth:
    issuer: ${CATALOG_AUTH_ISSUER:novacommerce-auth}
    audience: ${CATALOG_AUTH_AUDIENCE:novacommerce-api}
    jwks-uri: ${CATALOG_AUTH_JWKS_URI:http://localhost:8081/api/v1/auth/jwks}
  cache:
    product-ttl: ${CATALOG_CACHE_PRODUCT_TTL:PT10M}
  allowed-origins: ${CATALOG_ALLOWED_ORIGINS:http://localhost:3000}
